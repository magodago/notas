<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Notas</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notas">
<link rel="manifest" href="notas.webmanifest">
<link rel="apple-touch-icon" href="notas-icon.png">
<link rel="icon" href="notas-icon.png">
<style>
  :root {
    --bg: #ffffff;
    --bg-grupo: #f2f2f7;
    --bg-campo: #e9e9eb;
    --texto: #000000;
    --texto-2: #8a8a8e;
    --sep: rgba(60, 60, 67, .29);
    --sep-suave: rgba(60, 60, 67, .16);
    --amarillo: #ffb300;
    --azul: #007aff;
    --tarjeta: #ffffff;
    --sombra: 0 -1px 12px rgba(0, 0, 0, .06);
    /* Métricas del sistema: safe areas reales del iPhone */
    --s-top: env(safe-area-inset-top, 0px);
    --s-bot: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --bg-grupo: #1c1c1e;
      --bg-campo: #1c1c1e;
      --texto: #ffffff;
      --texto-2: #8e8e93;
      --sep: rgba(84, 84, 88, .65);
      --sep-suave: rgba(84, 84, 88, .45);
      --tarjeta: #1c1c1e;
      --sombra: 0 -1px 12px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { border: 0; background: none; padding: 0; margin: 0; text-align: left; }
  svg { display: block; }

  .pantalla {
    position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--bg);
    padding-bottom: calc(var(--s-bot) + 24px);
  }
  .pantalla[hidden] { display: none; }

  /* ---------- Barra superior ---------- */
  .barra {
    position: sticky; top: 0; z-index: 5;
    padding: calc(var(--s-top) + 6px) 16px 8px;
    background: var(--bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
  }
  .barra.fina { padding: calc(var(--s-top) + 4px) 8px 6px; display: flex; align-items: center; justify-content: space-between; }
  .grande {
    margin: 0 0 10px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -.6px;
  }
  .volver {
    display: flex; align-items: center; gap: 4px;
    min-height: 44px; padding: 0 6px; color: var(--amarillo); font-size: 17px; letter-spacing: -.2px;
  }
  .volver:active { opacity: .5; }
  .volver svg { width: 12px; height: 20px; }
  .accion-barra { min-height: 44px; padding: 0 10px; color: var(--amarillo); font-size: 17px; }
  .accion-barra:active { opacity: .5; }

  /* ---------- Buscador ---------- */
  .buscar {
    display: flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 8px; border-radius: 10px; background: var(--bg-campo);
    color: var(--texto-2);
  }
  .buscar svg { width: 15px; height: 15px; flex: none; }
  .buscar input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    font-size: 17px; color: var(--texto); -webkit-user-select: text; user-select: text;
  }
  .buscar input::placeholder { color: var(--texto-2); }

  /* ---------- Grupos y filas ---------- */
  .grupo-tit {
    padding: 10px 16px 6px; background: var(--bg-grupo);
    font-size: 13px; line-height: 18px; font-weight: 600; color: var(--texto-2);
    letter-spacing: -.06px;
  }
  .filas { background: var(--bg); }
  .fila { display: block; width: 100%; padding: 10px 16px; position: relative; }
  .fila:active { background: var(--bg-grupo); }
  .fila + .fila::before {
    content: ""; position: absolute; top: 0; left: 16px; right: 0;
    height: .5px; background: var(--sep-suave);
  }
  .fila-titulo {
    font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -.35px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fila-meta {
    display: flex; gap: 6px; font-size: 14px; line-height: 19px; color: var(--texto-2);
    white-space: nowrap; overflow: hidden;
  }
  .fila-meta .recorte { overflow: hidden; text-overflow: ellipsis; }
  .separador { height: .5px; background: var(--sep-suave); margin-left: 16px; }
  .vacio { padding: 40px 24px; text-align: center; color: var(--texto-2); font-size: 15px; }

  /* ---------- Botón componer ---------- */
  .componer {
    position: fixed; right: 16px; bottom: calc(var(--s-bot) + 16px); z-index: 6;
    width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
    color: var(--amarillo);
  }
  .componer:active { opacity: .5; }
  .componer svg { width: 30px; height: 30px; }

  /* ---------- Detalle de nota ---------- */
  .detalle { padding: 0 16px calc(var(--s-bot) + 40px); }
  .fecha-nota { padding: 4px 0 14px; text-align: center; font-size: 13px; line-height: 18px; color: var(--texto-2); }
  .titulo-nota, .cuerpo-nota {
    display: block; width: 100%; border: 0; background: none; outline: none; resize: none;
    -webkit-user-select: text; user-select: text;
  }
  .titulo-nota {
    font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -.5px;
    padding: 0 0 6px;
  }
  .cuerpo-nota { font-size: 17px; line-height: 24px; min-height: 55vh; letter-spacing: -.2px; }
  .papel { font-size: 17px; line-height: 24px; letter-spacing: -.2px; white-space: pre-wrap; }
  .categoria {
    margin: 0 0 2px; font-size: 15px; line-height: 20px; color: var(--texto-2);
  }
  .referencia { margin: 14px 0 0; font-size: 13px; line-height: 18px; color: var(--texto-2); }

  /* ---------- Índice 1–100 ---------- */
  .rejilla {
    display: grid; grid-template-columns: repeat(10, 1fr);
    gap: 1px; margin: 0 12px; background: var(--sep-suave);
    border: .5px solid var(--sep-suave); border-radius: 10px; overflow: hidden;
  }
  .celda {
    display: flex; align-items: center; justify-content: center;
    height: 40px; background: var(--bg); font-size: 13px; font-weight: 500;
    font-variant-numeric: tabular-nums; letter-spacing: -.3px;
  }
  .celda:active { background: var(--bg-grupo); }
  .celda.marcada { color: var(--texto-2); }
  .indice-cab { padding: 0 16px 12px; font-size: 13px; line-height: 18px; color: var(--texto-2); }

  /* ---------- Ajustes (oculto) ---------- */
  .hoja {
    position: fixed; inset: 0; z-index: 30; overflow-y: auto;
    background: var(--bg-grupo);
    padding: calc(var(--s-top) + 4px) 0 calc(var(--s-bot) + 40px);
    -webkit-overflow-scrolling: touch;
  }
  .hoja[hidden] { display: none; }
  .hoja-barra {
    position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 6px 16px 10px; background: var(--bg-grupo);
    font-size: 17px; font-weight: 700; letter-spacing: -.4px;
  }
  .hoja-barra button { font-weight: 600; color: var(--azul); }
  .bloque { margin: 0 16px 28px; }
  .bloque-tit {
    padding: 0 16px 7px; font-size: 13px; line-height: 18px; color: var(--texto-2);
    text-transform: uppercase;
  }
  .tarjeta { border-radius: 10px; overflow: hidden; background: var(--tarjeta); }
  .opcion {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; min-height: 44px; padding: 10px 16px; font-size: 17px; letter-spacing: -.3px;
  }
  .opcion + .opcion { border-top: .5px solid var(--sep-suave); }
  .opcion:active { background: var(--bg-grupo); }
  .opcion .valor { color: var(--texto-2); font-size: 17px; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .check { color: var(--azul); font-size: 17px; font-weight: 600; }
  .interruptor {
    position: relative; flex: none; width: 51px; height: 31px; border-radius: 16px;
    background: #767680; transition: background-color .2s;
  }
  .interruptor::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .28); transition: transform .2s;
  }
  [data-activo="1"] > .interruptor { background: #30d158; }
  [data-activo="1"] > .interruptor::after { transform: translateX(20px); }
  .nota-pie { margin: 0 16px; font-size: 13px; line-height: 18px; color: var(--texto-2); }
  .aviso-forzado {
    display: flex; align-items: center; gap: 8px;
    margin: 0 16px 16px; padding: 10px 14px; border-radius: 10px;
    background: rgba(255, 179, 0, .14); color: var(--texto); font-size: 14px; line-height: 19px;
  }
  .aviso-forzado strong { font-weight: 600; }
</style>
</head>
<body>

<!-- ============ LISTA ============ -->
<section class="pantalla" id="p-lista">
  <div class="barra">
    <h1 class="grande" id="titulo-app">Notas</h1>
    <label class="buscar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>
      <input id="busqueda" type="search" placeholder="Buscar" autocomplete="off" autocorrect="off" spellcheck="false">
    </label>
  </div>
  <div id="cuerpo-lista"></div>
  <button class="componer" id="btn-nueva" aria-label="Nueva nota">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.5 5.5H8.5A3.5 3.5 0 0 0 5 9v15a3.5 3.5 0 0 0 3.5 3.5H23a3.5 3.5 0 0 0 3.5-3.5V14"/>
      <path d="m15 22 9.4-9.4a2.5 2.5 0 0 0-3.5-3.5L11.5 18.5V22z"/>
    </svg>
  </button>
</section>

<!-- ============ NOTA ============ -->
<section class="pantalla" id="p-nota" hidden>
  <div class="barra fina">
    <button class="volver" data-ir="lista">
      <svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
      <span>Notas</span>
    </button>
    <button class="accion-barra" id="btn-borrar">Eliminar</button>
  </div>
  <div class="detalle">
    <div class="fecha-nota" id="fecha-nota"></div>
    <input class="titulo-nota" id="titulo-nota" placeholder="Título" autocomplete="off" spellcheck="false">
    <textarea class="cuerpo-nota" id="cuerpo-nota" placeholder="Escribe algo"></textarea>
  </div>
</section>

<!-- ============ ÍNDICE ============ -->
<section class="pantalla" id="p-indice" hidden>
  <div class="barra fina">
    <button class="volver" data-ir="lista">
      <svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
      <span>Notas</span>
    </button>
  </div>
  <div class="detalle">
    <div class="fecha-nota">Índice del repertorio</div>
    <div class="indice-cab" id="indice-cab"></div>
  </div>
  <div class="rejilla" id="rejilla"></div>
</section>

<!-- ============ ENTRADA ============ -->
<section class="pantalla" id="p-entrada" hidden>
  <div class="barra fina">
    <button class="volver" data-ir="indice">
      <svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
      <span>Índice</span>
    </button>
  </div>
  <div class="detalle">
    <div class="fecha-nota" id="entrada-fecha"></div>
    <h2 class="titulo-nota" id="entrada-titulo" style="font-size:30px;line-height:36px"></h2>
    <p class="categoria" id="entrada-cat"></p>
    <p class="referencia" id="entrada-ref"></p>
  </div>
</section>

<!-- ============ AJUSTES OCULTOS ============ -->
<div class="hoja" id="hoja" hidden>
  <div class="hoja-barra">
    <span>Ajustes</span>
    <button id="cerrar-hoja">OK</button>
  </div>

  <div class="bloque">
    <div class="bloque-tit">Lista</div>
    <div class="tarjeta" id="lista-opciones"></div>
  </div>

  <div class="bloque">
    <div class="bloque-tit">Forzado</div>
    <div class="tarjeta">
      <button class="opcion" id="elegir-forzado"><span>Entrada</span><span class="valor" id="valor-forzado">Ninguna</span></button>
      <button class="opcion" id="quitar-forzado"><span>Quitar forzado</span></button>
    </div>
  </div>

  <div class="bloque">
    <div class="bloque-tit">Estado</div>
    <div class="tarjeta">
      <button class="opcion" id="toggle-armado" data-activo="0"><span>Armado</span><span class="interruptor"></span></button>
    </div>
    <p class="nota-pie" style="padding-top:8px">Armado: cualquier entrada del índice muestra la entrada forzada. Desarmado: el índice muestra su contenido real.</p>
  </div>

  <div class="bloque">
    <div class="bloque-tit">Índice</div>
    <div class="tarjeta">
      <div class="opcion"><span>Entradas</span><span class="valor" id="valor-total">100</span></div>
      <div class="opcion"><span>Versión</span><span class="valor">1.0</span></div>
    </div>
  </div>
</div>

<!-- ============ SELECTOR DE ENTRADA ============ -->
<div class="hoja" id="hoja-picker" hidden>
  <div class="hoja-barra">
    <span id="picker-titulo">Elegir entrada</span>
    <button id="cerrar-picker">OK</button>
  </div>
  <div class="barra" style="position:static;padding:0 16px 10px;background:transparent;backdrop-filter:none">
    <label class="buscar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>
      <input id="busqueda-picker" type="search" placeholder="Buscar" autocomplete="off" spellcheck="false">
    </label>
  </div>
  <div class="tarjeta" id="picker-lista" style="margin:0 16px"></div>
</div>

<script src="data.js"></script>
<script>
'use strict';

const CLAVE_NOTAS = 'notas.v1';
const CLAVE_CFG = 'indice.v1';

/* ---------------- almacenamiento ---------------- */
function leer(clave, porDefecto) {
  try {
    const crudo = localStorage.getItem(clave);
    return crudo ? JSON.parse(crudo) : porDefecto;
  } catch { return porDefecto; }
}
function guardar(clave, valor) {
  try { localStorage.setItem(clave, JSON.stringify(valor)); } catch { /* privado */ }
}

const ahora = Date.now();
const HORA = 60 * 60 * 1000;
const DIA = 24 * HORA;

let notas = leer(CLAVE_NOTAS, null);
if (!Array.isArray(notas)) {
  notas = [
    { id: 'indice', fija: true, titulo: 'Índice', cuerpo: '', ts: ahora },
    { id: 'n2', titulo: 'Compra', cuerpo: 'Pilas AA\nCafé en grano\nCinta de doble cara\nSobre grande para el libro', ts: ahora - 6 * HORA },
    { id: 'n3', titulo: 'Guion corto', cuerpo: 'Abrir con la pregunta, nunca con el nombre.\nEl número antes que la promesa.', ts: ahora - 9 * HORA },
    { id: 'n4', titulo: 'Estudio', cuerpo: 'Llaves del local en el cajón de la mesa.\nTercera planta, puerta al fondo.', ts: ahora - 1 * DIA - 3 * HORA },
    { id: 'n5', titulo: 'Idea podcast', cuerpo: 'Capítulo 4: por qué el azar no existe.\nInvitado pendiente de confirmar.', ts: ahora - 1 * DIA - 8 * HORA },
    { id: 'n6', titulo: 'Verano', cuerpo: 'Reservar casa en la costa antes de mayo.\nMirar la que está junto al faro.', ts: ahora - 9 * DIA },
    { id: 'n7', titulo: 'Cámara', cuerpo: 'Cargar las dos baterías antes de la boda.\nFormatear la tarjeta.', ts: ahora - 21 * DIA }
  ];
  guardar(CLAVE_NOTAS, notas);
}

let cfg = leer(CLAVE_CFG, { lista: 'famosos', forzado: null, armado: false });
if (!cfg || !LISTAS[cfg.lista]) cfg = { lista: 'famosos', forzado: null, armado: false };

/* ---------------- utilidades ---------------- */
const $ = (sel) => document.querySelector(sel);
function uid() { return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function escapar(texto) {
  return String(texto).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const FECHA_LARGA = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
const FECHA_HORA = new Intl.DateTimeFormat('es-ES', { hour: '2-digit', minute: '2-digit', hour12: false });
const FECHA_CORTA = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short' });

function diaDe(ts) {
  const d = new Date(ts); d.setHours(0, 0, 0, 0);
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  return Math.round((hoy - d) / DIA);
}
function metaFecha(ts) {
  const dias = diaDe(ts);
  if (dias <= 0) return FECHA_HORA.format(ts);
  if (dias === 1) return 'Ayer';
  return FECHA_CORTA.format(ts);
}
function grupoDe(ts) {
  const dias = diaDe(ts);
  if (dias <= 0) return 'Hoy';
  if (dias === 1) return 'Ayer';
  return 'Anteriores';
}
function recorte(texto) {
  return String(texto || '').replace(/\s+/g, ' ').trim();
}

/* ---------------- pantallas ---------------- */
const pantallas = ['p-lista', 'p-nota', 'p-indice', 'p-entrada'];
function mostrar(nombre) {
  pantallas.forEach((id) => { document.getElementById(id).hidden = (id !== nombre); });
  const el = document.getElementById(nombre);
  if (el) el.scrollTop = 0;
}

/* ---------------- lista de notas ---------------- */
let filtro = '';

function filaHtml(nota) {
  const resumen = nota.fija ? 'Cien entradas · 1–100' : recorte(nota.cuerpo);
  return '<button class="fila" data-nota="' + nota.id + '">'
    + '<div class="fila-titulo">' + escapar(nota.titulo || 'Sin título') + '</div>'
    + '<div class="fila-meta"><span>' + metaFecha(nota.ts) + '</span>'
    + '<span class="recorte">' + escapar(resumen) + '</span></div>'
    + '</button>';
}

function dibujarLista() {
  const consulta = filtro.trim().toLowerCase();
  let visibles = notas.slice().sort((a, b) => b.ts - a.ts);
  if (consulta) {
    visibles = visibles.filter((n) =>
      (n.titulo + ' ' + n.cuerpo).toLowerCase().includes(consulta));
  }
  const contenedor = $('#cuerpo-lista');
  if (!visibles.length) {
    contenedor.innerHTML = consulta
      ? '<div class="vacio">Sin resultados</div>'
      : '<div class="vacio">No hay notas</div>';
    return;
  }
  let html = '';
  let grupoActual = null;
  let abierto = false;
  visibles.forEach((nota) => {
    const grupo = grupoDe(nota.ts);
    if (grupo !== grupoActual) {
      if (abierto) html += '</div>';
      html += '<div class="grupo-tit">' + grupo + '</div><div class="filas">';
      abierto = true;
      grupoActual = grupo;
    }
    html += filaHtml(nota);
  });
  if (abierto) html += '</div>';
  contenedor.innerHTML = html;
}

/* ---------------- detalle ---------------- */
let notaAbierta = null;

function abrirNota(id) {
  const nota = notas.find((n) => n.id === id);
  if (!nota) return;
  if (nota.fija) { abrirIndice(); return; }
  notaAbierta = id;
  $('#fecha-nota').textContent = FECHA_LARGA.format(nota.ts);
  $('#titulo-nota').value = nota.titulo;
  $('#cuerpo-nota').value = nota.cuerpo;
  mostrar('p-nota');
}

function guardarNotaAbierta() {
  const nota = notas.find((n) => n.id === notaAbierta);
  if (!nota) return;
  nota.titulo = $('#titulo-nota').value;
  nota.cuerpo = $('#cuerpo-nota').value;
  nota.ts = Date.now();
  guardar(CLAVE_NOTAS, notas);
}

/* ---------------- índice ---------------- */
function abrirIndice() {
  const lista = LISTAS[cfg.lista];
  const filas = cfg.armado && cfg.forzado ? '<strong>' + escapar(cfg.forzado.split('|')[0]) + '</strong> en todas las entradas' : 'contenido real';
  $('#indice-cab').innerHTML = escapar(lista.etiqueta) + ' · ' + TOTAL_ENTRADAS + ' entradas · ' + filas;
  let html = '';
  for (let n = 1; n <= TOTAL_ENTRADAS; n++) {
    html += '<button class="celda" data-entrada="' + n + '">' + n + '</button>';
  }
  $('#rejilla').innerHTML = html;
  mostrar('p-indice');
}

function itemDe(numero) {
  if (cfg.armado && cfg.forzado) return cfg.forzado;
  const lista = LISTAS[cfg.lista];
  return lista.items[(numero - 1) % lista.items.length];
}

function abrirEntrada(numero) {
  const [nombre, detalle] = itemDe(numero).split('|');
  $('#entrada-fecha').textContent = FECHA_LARGA.format(Date.now());
  $('#entrada-titulo').textContent = nombre;
  $('#entrada-cat').textContent = detalle || '';
  $('#entrada-ref').textContent = 'Entrada ' + numero + ' de ' + TOTAL_ENTRADAS
    + ' · índice de ' + LISTAS[cfg.lista].etiqueta.toLowerCase();
  mostrar('p-entrada');
}

/* ---------------- ajustes ocultos ---------------- */
function dibujarAjustes() {
  $('#lista-opciones').innerHTML = Object.keys(LISTAS).map((clave) =>
    '<button class="opcion" data-lista="' + clave + '"><span>' + LISTAS[clave].etiqueta + '</span>'
    + (cfg.lista === clave ? '<span class="check">✓</span>' : '') + '</button>').join('');
  $('#valor-forzado').textContent = cfg.forzado ? cfg.forzado.split('|')[0] : 'Ninguna';
  $('#toggle-armado').dataset.activo = cfg.armado && cfg.forzado ? '1' : '0';
  $('#valor-total').textContent = TOTAL_ENTRADAS;
}

function abrirAjustes() {
  dibujarAjustes();
  $('#hoja').hidden = false;
}

function dibujarPicker(consulta) {
  const texto = (consulta || '').trim().toLowerCase();
  const items = LISTAS[cfg.lista].items.filter((i) => !texto || i.toLowerCase().includes(texto));
  $('#picker-titulo').textContent = LISTAS[cfg.lista].etiqueta;
  $('#picker-lista').innerHTML = items.length
    ? items.map((item) => {
      const nombre = item.split('|')[0];
      return '<button class="opcion" data-item="' + escapar(item) + '"><span>' + escapar(nombre) + '</span>'
        + (cfg.forzado === item ? '<span class="check">✓</span>' : '') + '</button>';
    }).join('')
    : '<div class="vacio">Sin resultados</div>';
}

function abrirPicker() {
  $('#busqueda-picker').value = '';
  dibujarPicker('');
  $('#hoja-picker').hidden = false;
}

/* ---------------- eventos ---------------- */
document.addEventListener('click', (evento) => {
  const nota = evento.target.closest('[data-nota]');
  if (nota) { abrirNota(nota.dataset.nota); return; }

  const volver = evento.target.closest('[data-ir]');
  if (volver) {
    const destino = volver.dataset.ir;
    if (destino === 'lista') { dibujarLista(); mostrar('p-lista'); }
    if (destino === 'indice') { abrirIndice(); }
    return;
  }

  const entrada = evento.target.closest('[data-entrada]');
  if (entrada) { abrirEntrada(Number(entrada.dataset.entrada)); return; }

  const opcionLista = evento.target.closest('[data-lista]');
  if (opcionLista) {
    cfg.lista = opcionLista.dataset.lista;
    if (cfg.forzado && !LISTAS[cfg.lista].items.includes(cfg.forzado)) {
      cfg.forzado = null; cfg.armado = false;
    }
    guardar(CLAVE_CFG, cfg);
    dibujarAjustes();
    return;
  }

  const opcionItem = evento.target.closest('[data-item]');
  if (opcionItem) {
    cfg.forzado = opcionItem.dataset.item;
    cfg.armado = true;
    guardar(CLAVE_CFG, cfg);
    $('#hoja-picker').hidden = true;
    dibujarAjustes();
    return;
  }
});

$('#busqueda').addEventListener('input', (evento) => {
  filtro = evento.target.value;
  dibujarLista();
});

$('#busqueda-picker').addEventListener('input', (evento) => {
  dibujarPicker(evento.target.value);
});

$('#btn-nueva').addEventListener('click', () => {
  const nota = { id: uid(), titulo: '', cuerpo: '', ts: Date.now() };
  notas.unshift(nota);
  guardar(CLAVE_NOTAS, notas);
  filtro = '';
  $('#busqueda').value = '';
  abrirNota(nota.id);
  setTimeout(() => $('#titulo-nota').focus(), 60);
});

$('#btn-borrar').addEventListener('click', () => {
  const nota = notas.find((n) => n.id === notaAbierta);
  if (!nota || nota.fija) return;
  if (!confirm('¿Eliminar esta nota?')) return;
  notas = notas.filter((n) => n.id !== notaAbierta);
  guardar(CLAVE_NOTAS, notas);
  notaAbierta = null;
  dibujarLista();
  mostrar('p-lista');
});

$('#titulo-nota').addEventListener('input', guardarNotaAbierta);
$('#cuerpo-nota').addEventListener('input', guardarNotaAbierta);

$('#cerrar-hoja').addEventListener('click', () => { $('#hoja').hidden = true; dibujarLista(); mostrar('p-lista'); });
$('#cerrar-picker').addEventListener('click', () => { $('#hoja-picker').hidden = true; });

$('#elegir-forzado').addEventListener('click', abrirPicker);

$('#quitar-forzado').addEventListener('click', () => {
  cfg.forzado = null;
  cfg.armado = false;
  guardar(CLAVE_CFG, cfg);
  dibujarAjustes();
});

$('#toggle-armado').addEventListener('click', () => {
  if (!cfg.forzado) { abrirPicker(); return; }
  cfg.armado = !cfg.armado;
  guardar(CLAVE_CFG, cfg);
  dibujarAjustes();
});

/* Gesto oculto: tres toques rápidos (o pulsación larga) sobre el título «Notas». */
(function gestoOculto() {
  const titulo = $('#titulo-app');
  let toques = 0;
  let temporizador = null;
  let pulsacion = null;
  let largo = false;

  ['pointerdown', 'touchstart'].forEach((tipo) => titulo.addEventListener(tipo, (evento) => {
    if (evento.cancelable) evento.preventDefault();
    largo = false;
    clearTimeout(pulsacion);
    pulsacion = setTimeout(() => { pulsacion = null; largo = true; abrirAjustes(); }, 1100);
  }, { passive: false }));

  ['pointerup', 'pointercancel', 'pointerleave', 'touchend', 'touchcancel'].forEach((tipo) => {
    titulo.addEventListener(tipo, () => {
      if (pulsacion) { clearTimeout(pulsacion); pulsacion = null; }
    });
  });

  titulo.addEventListener('click', () => {
    if (largo) { largo = false; return; }
    toques += 1;
    clearTimeout(temporizador);
    temporizador = setTimeout(() => { toques = 0; }, 700);
    if (toques >= 3) {
      toques = 0;
      clearTimeout(temporizador);
      abrirAjustes();
    }
  });
})();

document.addEventListener('contextmenu', (evento) => {
  if (evento.target.tagName !== 'INPUT' && evento.target.tagName !== 'TEXTAREA') evento.preventDefault();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

dibujarLista();
mostrar('p-lista');
</script>
